# revoice config. /revoice --build copies this to ~/.config/revoice/config.yaml
# (Windows: C:\Users\<you>\.config\revoice\config.yaml). The skill reads it on every run.

# Voice used when --voice is not given. Must match ~/.config/revoice/voices/<slug>.md
# (or a voice bundled with the skill, such as example).
default_voice: your-name

# Base dir for relative local paths (--output-path, --template). Empty = current working directory.
fs_base: ""

# Template used only when saving to SilverBullet (--output-path=sb:...) and --template is not given.
# --template=none skips it for one run. Empty = no default.
default_template: ""

# Audience used when --audience is not given. Empty = base voice only, no audience layer.
default_audience: ""

# Audiences --audience accepts. An optional ~/.config/revoice/voices/<slug>-<audience>.md holds only the
# differences from the base voice; without one, the skill uses short built-in steering.
audiences: [casual, business, formal]

# --- Optional: SilverBullet. Leave these empty if you do not use SilverBullet. ---

# Folder prefix for relative sb: paths. Empty = use the sb: path as given.
sb_base: ""

# SilverBullet server. --sync fetches raw notes from <sb_url>/.fs/<path>.
sb_url: ""

# Master copy of each voice in SilverBullet. Used only by /revoice --sync.
voices: {}
#  your-name:
#    sb_source: "Writing Profiles/Your Name.md"
