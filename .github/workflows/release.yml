name: Release

# The owner pushes a `v0.2.0`-form tag; this checks it and makes the GitHub
# release. Nothing here pushes a tag or edits a file.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    name: Check versions and run tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Fails unless the tag minus its `v` equals plugin.json `version`,
      # SKILL.md `metadata.version` and the newest released CHANGELOG heading.
      - name: Versions agree with the tag
        run: python3 .github/scripts/release-notes.py "${GITHUB_REF_NAME#v}" --check > /dev/null

      - name: Unit tests
        run: python3 -m unittest discover -v skill/revoice/tests

  release:
    name: Create GitHub release
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # The only job with write access, and it runs no project tests.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Release notes from CHANGELOG.md
        run: python3 .github/scripts/release-notes.py "${GITHUB_REF_NAME#v}" --check > "$RUNNER_TEMP/notes.md"

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --verify-tag \
            --title "$GITHUB_REF_NAME" --notes-file "$RUNNER_TEMP/notes.md"
